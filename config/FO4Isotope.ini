[General]
# Enable HDR: needs an HDR10 display with Windows HDR on; applies at game start.
HdrEnabled=1
# SDR color controls (the Sdr sections) when HDR is off or unavailable; they
# have no effect under ENB.
SdrEnabled=1
# Required by the [Debug] keys; adds the Diagnostics tab and detailed logging.
DeveloperMode=0

[Output]
# Display Peak Brightness: 400 to 2000 nits.
DisplayPeakNits=1000
# Menu & HUD White: 100 to 300 nits.
UiPaperWhiteNits=203
# Video White: 100 to 300 nits.
VideoWhiteNits=203

[ToneMapper]
# ACES2, AgX or GT7.
Algorithm=GT7

[ACES2]
# Contrast Look Strength: 0 to 1.
ContrastLookStrength=1

[AgX]
# Middle Gray: -0.5 to 0.5 EV.
MiddleGrayOffsetEV=0
# Curve Contrast: 2.2 to 3.0.
Contrast=2.7
# Color Response: 0.25 to 0.60.
ColorResponse=0.5
# Highlight Shoulder: 1.75 to 2.25.
ShoulderPower=2

[GT7]
# Shadow Toe: 1.0 to 1.5.
ToeStrength=1.28
# Shoulder Start: 0.35 to 0.60.
ShoulderStart=0.444
# Color Blend: 0 to 1.
ColorBlend=0.6

[Image]
# Color Grading Method, HDR only: RgbRatio or Affine.
ColorGradingMethod=RgbRatio
# Color Grading Curve, HDR only: Gamma22 or sRGB. Gamma22 keeps the look's
# deeper shadows; sRGB lifts graded shadows.
ColorGradingCurve=Gamma22
# Exposure: -4 to 4 EV.
ExposureEV=0
# -100 to 100, except Saturation (Overall Saturation) and HighlightSaturation:
# 0 to 200 percent.
Contrast=0
Blacks=0
Highlights=0
Shadows=0
Saturation=100
HighlightSaturation=100
Temperature=0
Tint=0

[SelectiveColor]
# Amount: 0 to 100 percent. Per color, Hue: -10 to 10 degrees; Saturation:
# 50 to 150 percent; Brightness: -100 to 100.
Enabled=0
Amount=100
RedHue=0
RedSaturation=100
RedBrightness=0
OrangeHue=0
OrangeSaturation=100
OrangeBrightness=0
YellowHue=0
YellowSaturation=100
YellowBrightness=0
GreenHue=0
GreenSaturation=100
GreenBrightness=0
CyanHue=0
CyanSaturation=100
CyanBrightness=0
BlueHue=0
BlueSaturation=100
BlueBrightness=0
MagentaHue=0
MagentaSaturation=100
MagentaBrightness=0

[Effects]
# 0 to 100 percent. The menu shows VanillaGradeLuminanceStrength as Global Grade
# Luminance and VanillaGradeColorStrength as Global Grade Color.
VanillaColorGradingStrength=100
VanillaGradeLuminanceStrength=67
VanillaGradeColorStrength=67
BloomStrength=50

[WeatherLutResponse]
# Automatic Weather LUT Response: one fixed response per weather ImageSpace.
# Base, Minimum and Maximum: 0 to 100 percent, Minimum not above Maximum.
# Gain: 0 to 2. Intercept and the four sensitivities: -1000 to 1000.
# The menu shows Base as Baseline, Gain as Response Amount, Minimum and Maximum
# as Minimum and Maximum Retention, and Sunlight, Glare, Ambient and ColorChange
# as Sunlight, Glare, Ambient and Sunlight Color Change Sensitivity.
Enabled=1
LuminanceBase=100
LuminanceGain=1
LuminanceMinimum=0
LuminanceMaximum=100
LuminanceIntercept=105.853889
LuminanceSunlight=-21.104094
LuminanceGlare=-82.698734
LuminanceAmbient=80.839967
LuminanceColorChange=-66.328886
ColorBase=100
ColorGain=1
ColorMinimum=0
ColorMaximum=100
ColorIntercept=118.057618
ColorSunlight=-19.199377
ColorGlare=-57.753864
ColorAmbient=11.932621
ColorColorChange=-84.208685

[SdrToneMapper]
# The Sdr sections apply when HDR is off or unavailable. They take the keys and
# ranges of the matching sections above except where noted; these defaults
# reproduce the game's own SDR image.
# Vanilla keeps the game's tone curve; ACES2, AgX or GT7 replace it.
Algorithm=Vanilla
# With ACES2, AgX or GT7, turns the weather response on whatever
# [SdrWeatherLutResponse] Enabled says; Vanilla follows that setting.
AutomaticWeatherResponse=1

[SdrACES2]
ContrastLookStrength=0.44

[SdrAgX]
# Middle Gray: -0.5 to 0 EV; AgX can only lower middle gray in SDR.
# No ShoulderPower: it has no effect at the SDR white.
MiddleGrayOffsetEV=-0.39
Contrast=2.7
ColorResponse=0.5

[SdrGT7]
# Shoulder Start: 0.216 to 0.60; 0.216 starts the shoulder where the toe ends.
ToeStrength=1.28
ShoulderStart=0.28
ColorBlend=0.6

[SdrImage]
# No ColorGradingMethod or ColorGradingCurve: they apply only to HDR.
ExposureEV=0
Contrast=0
Blacks=0
Highlights=0
Shadows=0
Saturation=100
HighlightSaturation=100
Temperature=0
Tint=0

[SdrSelectiveColor]
Enabled=0
Amount=100
RedHue=0
RedSaturation=100
RedBrightness=0
OrangeHue=0
OrangeSaturation=100
OrangeBrightness=0
YellowHue=0
YellowSaturation=100
YellowBrightness=0
GreenHue=0
GreenSaturation=100
GreenBrightness=0
CyanHue=0
CyanSaturation=100
CyanBrightness=0
BlueHue=0
BlueSaturation=100
BlueBrightness=0
MagentaHue=0
MagentaSaturation=100
MagentaBrightness=0

[SdrEffects]
VanillaColorGradingStrength=100
VanillaGradeLuminanceStrength=100
VanillaGradeColorStrength=100
BloomStrength=100

[SdrWeatherLutResponse]
Enabled=0
LuminanceBase=100
LuminanceGain=1
LuminanceMinimum=0
LuminanceMaximum=100
LuminanceIntercept=105.853889
LuminanceSunlight=-21.104094
LuminanceGlare=-82.698734
LuminanceAmbient=80.839967
LuminanceColorChange=-66.328886
ColorBase=100
ColorGain=1
ColorMinimum=0
ColorMaximum=100
ColorIntercept=118.057618
ColorSunlight=-19.199377
ColorGlare=-57.753864
ColorAmbient=11.932621
ColorColorChange=-84.208685

[Debug]
# Developer diagnostics, off when omitted; each requires DeveloperMode=1.
# Logs a draw and Present trace: Ctrl+Shift+F11 captures eight frames; with HDR
# on, Ctrl+Alt+Shift+F11 captures up to the first black frame.
TraceRenderPipeline=0
# Logs CPU and GPU frame times after a save; runs only at exactly 2560x1440.
MeasurePerformance=0
# Replaces the tone mapper with a fixed reference: scene 1.0 maps to 203 nits.
DeveloperHdr10Reference=0
# Fails HDR swap-chain creation once to test the fallback to the original one.
ForceHdrSwapChainFailure=0
