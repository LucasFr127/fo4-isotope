[General]
Enabled=1
DeveloperMode=0

[Output]
# Display peak: 400-2000 nits.
DisplayPeakNits=1000.0
# UI paper white: 100-300 nits.
UiPaperWhiteNits=203.0
# Advanced video reference white.
VideoWhiteNits=203.0

[ToneMapper]
# Available production operators: ACES2LMT, AgX, and GT7.
Algorithm=ACES2LMT

[ACES2LMT]
# LookStrength: 0.0 to 1.0.
LookStrength=1

[AgX]
# MiddleGray: -0.25 to +0.25 EV; Contrast: 2.4 to 3.0 (default 2.7).
# HdrPurity: 0.35 to 0.60; ShoulderPower: 1.9 to 2.1.
MiddleGray=0
Contrast=2.7
HdrPurity=0.5
ShoulderPower=2

[GT7]
# ToeStrength: 1.0 to 1.5; ShoulderStart: 0.35 to 0.60.
# ColorBlend: 0.0 to 0.8.
ToeStrength=1.28
ShoulderStart=0.444
ColorBlend=0.6

[Image]
# Color grading: Radial or NativeReference. Both use the selected tone mapper.
ColorGradingMethod=Radial
# Scene exposure correction in stops.
# Valid range: -4.0 to +4.0 EV.
Exposure=0
# Neutral image controls.
# Contrast, Blacks, Highlights, Shadows, Temperature, and Tint accept
# -100 to 100. Saturation accepts 0 to 200 percent.
Contrast=0
Blacks=0
Highlights=0
Shadows=0
Saturation=100
Temperature=0
Tint=0

[SelectiveColor]
# Smooth Tetra selective color. Off and neutral settings are exact identity.
# Hue: -10..10 degrees; Saturation: 50..150 percent; Brightness: -100..100.
Enabled=0
Amount=100
RedHue=0
RedSaturation=100
RedBrightness=0
OrangeHue=0
OrangeSaturation=100
OrangeBrightness=0
YellowHue=0
YellowSaturation=100
YellowBrightness=0
GreenHue=0
GreenSaturation=100
GreenBrightness=0
CyanHue=0
CyanSaturation=100
CyanBrightness=0
BlueHue=0
BlueSaturation=100
BlueBrightness=0
MagentaHue=0
MagentaSaturation=100
MagentaBrightness=0

[Effects]
VanillaColorGradingStrength=100
VanillaGradeLuminance=100
VanillaGradeColor=100
# Enables both LUT asset and ImageSpace record profiles saved by Grade Profiles.
# Shared profiles: Fallout4HDR/*.ini; Z filenames win over A (case-insensitive).
# Save writes Fallout4HDR/Personal.ini, which always wins over shared profiles.
LutProfilesEnabled=1
BloomStrength=100

[Interface]
# A single keyboard key, optionally prefixed with Ctrl+, Alt+, and/or Shift+
# Examples: Alt+H, F10, Ctrl+Shift+H
ToggleKey=Alt+H
# Interface scale is one of 1.0, 1.25, 1.5, 1.75, or 2.0. Window dimensions
# are unscaled logical pixels; the live scale applies to text, controls,
# spacing, and the saved window size together.
Scale=1.25
WindowWidth=700
WindowHeight=680
# Client-area pixel position. -1/-1 starts centered.
WindowX=-1
WindowY=-1

[Debug]
# Shader/resource tracing without runtime shader compilation.
TraceRenderPipeline=0
# Bounded ReleaseDbg performance measurement: 300 warm-up frames followed by one
# fixed 1800-frame sample.
MeasurePerformance=0
# Numerical HDR10 foundation validation only: the relative scene reference
# maps 1.0 to 203 nits and explicitly overrides the production operator.
DeveloperHdr10Reference=0
ShowDeveloperOverlay=0
# Exercises the one-attempt HDR descriptor -> original descriptor fallback.
ForceHdrSwapChainFailure=0
