version = 1

# Fallback metadata for maintained project files. Existing file and snippet
# notices take precedence, including all upstream copyright and license terms.
[[annotations]]
path = [
    ".clang-format", ".editorconfig", ".gitattributes", ".gitmodules", ".gitignore",
    ".github/workflows/*.yml",
    "config/**", "include/**", "runtime/**", "schemas/**", "scripts/**",
    "shaders/**", "src/**", "tests/**", "local.env.example.ps1",
    "versions.lock.json", "xmake.lua", "xmake-requires.lock",
    "THIRD_PARTY_NOTICES.md", "third_party/xmake-source-manifest.json",
    "third_party/gt7/UPSTREAM.lock.json"
]
precedence = "closest"
SPDX-FileCopyrightText = "FO4Isotope contributors"
SPDX-License-Identifier = "LicenseRef-FO4Isotope-GPL-3.0-or-later-with-CommonLibF4-Exceptions"

# The official oracle is retained byte-for-byte, with its original notice.
[[annotations]]
path = "third_party/gt7/upstream/gt7_tone_mapping.cpp"
precedence = "closest"
SPDX-FileCopyrightText = "2025 Polyphony Digital Inc."
SPDX-License-Identifier = "MIT"

